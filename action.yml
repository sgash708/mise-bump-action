name: "mise-bump-action"
description: "Bump mise-managed tool versions with Dependabot-style pull requests"

inputs:
  mise-config-path:
    description: "Path(s) to mise.toml, newline-separated for multiple files"
    required: false
    default: "mise.toml"
  pr-strategy:
    description: "per-tool (one PR per tool) or single (bundle all into one PR)"
    required: false
    default: "per-tool"
  labels:
    description: "Comma-separated labels to add to opened pull requests"
    required: false
    default: "dependencies"
  base-branch:
    description: "Base branch for pull requests (defaults to the current ref)"
    required: false
    default: ""
  dry-run:
    description: "If true, print intended pull request title/body/diff to the job summary without creating any branch or pull request"
    required: false
    default: "false"
  ignore:
    description: "Comma-separated tool-name patterns to never bump (exact name, or a prefix ending in *)"
    required: false
    default: ""
  max-open-prs:
    description: "Cap on how many bump pull requests (carrying `labels`) may be open at once; 0 means unlimited"
    required: false
    default: "0"

outputs:
  pr-numbers:
    description: "Comma-separated pull request numbers opened this run (empty if none)"
    value: ${{ steps.run.outputs.pr-numbers }}
  opened-count:
    description: "How many pull requests were opened this run"
    value: ${{ steps.run.outputs.opened-count }}

runs:
  using: "composite"
  steps:
    - name: Download and verify mise-bump-action binary
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *)
            echo "::error::mise-bump-action only ships linux/amd64 and linux/arm64 binaries; this runner is $(uname -m)." >&2
            exit 1
            ;;
        esac

        gh release download v1.7.1 \
          --repo sgash708/mise-bump-action \
          --pattern "mise-bump-action_linux_${arch}" \
          --pattern 'checksums.txt' \
          --dir "${{ github.action_path }}" \
          --clobber

        cd "${{ github.action_path }}"
        sha256sum -c checksums.txt --ignore-missing
        # checksums.txt is co-located with the binary in the same release, so
        # on its own it only guards against transit corruption, not a
        # compromised release. gh attestation verify checks the binary
        # against Sigstore-signed provenance tied to this repo's build
        # workflow (ADR 0011), which is independent of the release assets.
        gh attestation verify "mise-bump-action_linux_${arch}" --repo sgash708/mise-bump-action
        chmod +x "mise-bump-action_linux_${arch}"
        mv "mise-bump-action_linux_${arch}" mise-bump-action

    - name: Run mise-bump-action
      id: run
      shell: bash
      env:
        INPUT_MISE_CONFIG_PATH: ${{ inputs.mise-config-path }}
        INPUT_PR_STRATEGY: ${{ inputs.pr-strategy }}
        INPUT_LABELS: ${{ inputs.labels }}
        INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_MAX_OPEN_PRS: ${{ inputs.max-open-prs }}
        GITHUB_TOKEN: ${{ github.token }}
      run: "${{ github.action_path }}/mise-bump-action"

branding:
  icon: "refresh-cw"
  color: "blue"

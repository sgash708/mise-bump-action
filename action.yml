name: "mise-bump-action"
description: "Bump mise-managed tool versions with Dependabot-style pull requests"

inputs:
  mise-config-path:
    description: "Path(s) to mise.toml, newline-separated for multiple files"
    required: false
    default: "mise.toml"
  pr-strategy:
    description: "per-tool (one PR per tool) or single (bundle all into one PR)"
    required: false
    default: "per-tool"
  labels:
    description: "Comma-separated labels to add to opened pull requests"
    required: false
    default: "dependencies"
  base-branch:
    description: "Base branch for pull requests (defaults to the current ref)"
    required: false
    default: ""
  dry-run:
    description: "If true, print intended pull request title/body/diff to the job summary without creating any branch or pull request"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Download and verify mise-bump-action binary
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "$(uname -m)" != "x86_64" ]; then
          echo "::error::mise-bump-action v0 only ships a linux/amd64 binary; this runner is $(uname -m)." >&2
          exit 1
        fi

        gh release download v0.2.4 \
          --repo sgash708/mise-bump-action \
          --pattern 'mise-bump-action_linux_amd64' \
          --pattern 'checksums.txt' \
          --dir "${{ github.action_path }}" \
          --clobber

        cd "${{ github.action_path }}"
        sha256sum -c checksums.txt
        chmod +x mise-bump-action_linux_amd64

    - name: Run mise-bump-action
      shell: bash
      env:
        INPUT_MISE_CONFIG_PATH: ${{ inputs.mise-config-path }}
        INPUT_PR_STRATEGY: ${{ inputs.pr-strategy }}
        INPUT_LABELS: ${{ inputs.labels }}
        INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        GITHUB_TOKEN: ${{ github.token }}
      run: "${{ github.action_path }}/mise-bump-action_linux_amd64"

branding:
  icon: "refresh-cw"
  color: "blue"

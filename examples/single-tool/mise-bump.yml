# mise-bump-action ワークフロー例(単一ファイル・per-tool)。
# .github/workflows/mise-bump.yml としてコピーして使う。
name: mise-bump

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  mise-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: sgash708/mise-bump-action@v0.2.1
        with:
          mise-config-path: mise.toml
          pr-strategy: per-tool

# mise-bump-action ワークフロー例(複数ツールを1PRにまとめるpr-strategy: single)。
# .github/workflows/mise-bump.yml としてコピーして使う。
name: mise-bump

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  mise-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: sgash708/mise-bump-action@v0.2.3
        with:
          mise-config-path: mise.toml
          pr-strategy: single

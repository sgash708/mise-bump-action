[tools]
"aqua:golangci/golangci-lint" = "2.13.2"
"aqua:rhysd/actionlint" = "1.7.12"
"go:github.com/matryer/moq" = "v0.7.1"

[tasks.build]
description = "Build the mise-bump-action binary"
run = "go build -o bin/mise-bump-action ./cmd/mise-bump-action"

[tasks.test]
description = "Run all Go tests"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.fmt]
description = "Format Go source (gofmt + goimports)"
run = '''
gofmt -l -w .
goimports -l -w .
'''

[tasks.release]
description = "Bump action.yml's pinned binary version, tag vX.Y.Z, and move the floating major tag (usage: VERSION=v0.2.6 mise run release)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
: "${VERSION:?VERSION is required, e.g. VERSION=v0.1.0 mise run release}"
sed -i.bak -E "s#(gh release download )v[0-9]+\.[0-9]+\.[0-9]+( \\\\)#\1${VERSION}\2#" action.yml
rm -f action.yml.bak
git add action.yml
git commit -m "chore: release ${VERSION}"
git tag "${VERSION}"
major="${VERSION%%.*}"
git tag -f "${major}"
echo "Now run: git push && git push origin ${VERSION} && git push origin ${major} --force"
'''

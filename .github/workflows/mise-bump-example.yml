name: mise-bump-example

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview only, do not open a pull request"
        type: boolean
        default: false

jobs:
  mise-bump-example:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - uses: sgash708/mise-bump-action@v0
        with:
          mise-config-path: examples/single-tool/mise.toml
          pr-strategy: per-tool
          dry-run: ${{ inputs.dry-run }}

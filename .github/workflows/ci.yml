name: ci

# Note: on a pull_request run from a fork, GitHub always forces GITHUB_TOKEN
# to read-only regardless of the `permissions:` block below (a platform
# security restriction, not something this workflow controls). octocov's
# PR-comment step then silently has nothing to post with. This repo has no
# external fork contributors today, so it's accepted as a documented
# limitation rather than worked around with pull_request_target.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      # To comment on PRs (octocov)
      pull-requests: write
      # To retrieve test step time in GitHub Actions (octocov)
      contents: read
      # To retrieve/store previous coverage reports as Artifacts (octocov)
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -coverprofile=coverage.out

      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1

name: lint

# Note: on a pull_request run from a fork, GitHub always forces GITHUB_TOKEN
# to read-only regardless of the `permissions:` block below (a platform
# security restriction, not something this workflow controls). The
# reviewdog steps' github-check reporter then fails to post checks. This
# repo has no external fork contributors today, so it's accepted as a
# documented limitation rather than worked around with pull_request_target.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        run: golangci-lint run

      - uses: reviewdog/action-actionlint@419a49378266e892f40c773b4f2fc6de9aa87499 # v1
        with:
          reporter: github-check
          fail_level: error
          filter_mode: nofilter

      - uses: reviewdog/action-yamllint@3224b47de22a2fd9c8c0fbc120e6d0049d1f5060 # v1
        with:
          reporter: github-check
          fail_level: error
          filter_mode: nofilter
          yamllint_flags: "-c .yamllint.yml ."

name: lint

# Note: on a pull_request run from a fork, GitHub always forces GITHUB_TOKEN
# to read-only regardless of the `permissions:` block below (a platform
# security restriction, not something this workflow controls). The
# reviewdog steps' github-check reporter then fails to post checks. This
# repo has no external fork contributors today, so it's accepted as a
# documented limitation rather than worked around with pull_request_target.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        run: golangci-lint run

      - uses: reviewdog/action-actionlint@2085657ab2c7f48c58edcc767fba576f63bea76b # v1
        with:
          reporter: github-check
          fail_level: error
          filter_mode: nofilter

      - uses: reviewdog/action-yamllint@290d92c84b22627946efc7fd6f038ade2d2beede # v1
        with:
          reporter: github-check
          fail_level: error
          filter_mode: nofilter
          yamllint_flags: "-c .yamllint.yml ."
